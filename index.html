<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .video {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 500px;
            display: block;
            border: 0;
        }

        @media (max-width: 600px) {
            iframe {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="video">
        <iframe
            src="https://tv1.indoav.app/e/M63O5nDB3ebR"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
