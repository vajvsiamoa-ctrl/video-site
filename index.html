<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Header */
        header {
            height: 64px;
            background: #151518;
            border-bottom: 1px solid #29292d;
            display: flex;
            align-items: center;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff3b5c;
        }

        /* Main */
        main {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 24px 15px 50px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Video card */
        .video-card {
            background: #151518;
            border: 1px solid #29292d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-info {
            padding: 15px 17px;
        }

        .video-title {
            font-size: 17px;
            font-weight: 600;
        }

        .video-meta {
            margin-top: 7px;
            color: #888;
            font-size: 13px;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 25px 15px;
            border-top: 1px solid #222;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header {
                height: 56px;
                padding: 0 15px;
            }

            .logo {
                font-size: 19px;
            }

            main {
                padding: 18px 10px 35px;
            }

            .section-title {
                font-size: 18px;
            }

            .video-card {
                border-radius: 8px;
            }

            .video-info {
                padding: 12px;
            }

            .video-title {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            Video<span>Hub</span>
        </div>
    </header>

    <main>

        <div class="section-title">
            Latest Videos
        </div>

        <div class="video-card">

            <div class="video-wrapper">
                <iframe
                    src="https://tv1.indoav.app/e/M63O5nDB3ebR"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-info">
                <div class="video-title">
                    Video 01
                </div>

                <div class="video-meta">
                    Watch video
                </div>
            </div>

        </div>

    </main>

    <footer>
        © 2026 VideoHub
    </footer>

</body>
</html>
