<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub</title>

    <link rel="preconnect" href="https://tv1.indoav.app">
    <link rel="dns-prefetch" href="https://tv1.indoav.app">
    <link rel="preconnect" href="https://abacus.jasoncameron.dev">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 64px;
            background: #151518;
            border-bottom: 1px solid #29292d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff3b5c;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #aaa;
            font-size: 13px;
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 24px 15px 50px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        #videos {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .video-card {
            background: #151518;
            border: 1px solid #29292d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-info {
            padding: 15px 17px;
        }

        .video-title {
            font-size: 17px;
            font-weight: 600;
        }

        .video-meta {
            margin-top: 0;
            color: #888;
            font-size: 13px;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .pagination button {
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            background: #151518;
            color: #fff;
            border: 1px solid #29292d;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #ff3b5c;
        }

        .pagination button.active {
            background: #ff3b5c;
            border-color: #ff3b5c;
            font-weight: 700;
        }

        .pagination button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 25px 15px;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            header { height: 56px; padding: 0 12px; }
            .logo { font-size: 19px; }
            .stats { font-size: 11px; gap: 10px; }
            main { padding: 18px 10px 35px; }
            .section-title { font-size: 18px; }
            #videos { gap: 16px; }
            .video-card { border-radius: 8px; }
            .video-info { padding: 12px; }
            .video-title { font-size: 15px; }
            .pagination button { min-width: 36px; height: 36px; padding: 0 10px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Video<span>Hub</span></div>
        <div class="stats">
            <span id="visits"></span>
            <span id="plays"></span>
        </div>
    </header>

    <main>
        <div class="section-title">Latest Videos</div>
        <div id="videos"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <footer>© 2026 VideoHub</footer>

    <script>
        /* ========= الإعدادات ========= */
        const PER_PAGE = 8; // عدد الفيديوهات في الصفحة

        // اسم خاص بموقعك للعدادات (متغيروش وإلا الأرقام هتبدأ من الصفر)
        const NAMESPACE = "videohub-k7q2x9";
        const COUNTER_API = "https://abacus.jasoncameron.dev";

        // مفاتيح العدادات الإجمالية
        const KEY_SITE = "site";               // إجمالي الزيارات
        const KEY_TOTAL_PLAYS = "total_plays"; // إجمالي مرات تشغيل كل الفيديوهات

        // أضف أي فيديو جديد هنا: حط الـ ID بس (الجزء اللي بعد /e/)
        const videoIds = [
            "BFx6MFJazkX5", "pdQPpKIXzClX", "M63O5nDB3ebR", "mJUEEbcBRTIw", "HHxlvVwxS1x3",
            "e6F0xlxW2rZz", "pfCw8aIr1eGN", "KXvA7lwH2PPH", "MvZDN8ZSmogf", "22eRQqfPnUuI",
            "wJa7wif6Rn8u", "yHXFILt9oA1s", "oVKRkh3J4y7y", "Y621Yu0SwhOo", "CD2fCV9MlUmr",
            "FHHvWFVgQWEG", "qCDEq4q1PuNx", "3gtGkOMnPmwO", "NnhCvnt3habU", "y8Cz7wgUS7CQ",
            "wxStXlYOCo8Z", "vb2tg2kJYgqq", "aD8qyzHzFcvw", "XJvnjcterq84", "DSCXT8CRSJE2",
            "kqJGfVDo8gxo", "uNsER7hAQp2c", "PzA2bpaiBE0X", "14JnFENWO2mY", "GQ52o4jER3Mb",
            "ZRtBgzo386ot", "WI3LkZ3JzMEX", "cB4Lh1zOGv1C", "SRjGiw6GBx08", "fwMg7Q47X1qH",
            "OLr07LLWDlyC", "JG05hqc59AnR", "XRYy1EnMyb1r", "DGeTXhpHFQLn", "qiQN5bAyQ8LO",
            "hKe8myy8oN9o", "Pty9OeO1uBu7", "E88S69k50yAV", "xP7EnHewKtOP", "KjXMPptfAYtN",
            "piwp2RvnOxS4", "d3UxuyBb6Pu3", "RkZz5ITztRfu", "jOuCy1xMBNTu", "SI21LA7dsNYF",
            "g7dL8jCEI8zi", "QImCrWSbRI1H", "H21Nw9po5sbr", "OXFxyEwuviK4", "akXhOA6DbKxT",
            "rOhkNr04AE0q", "ZgaqiiyLP3TR", "8QpABRotycJ6", "TZBTBg8Y4FzB", "3RNwVs9Iw7dd",
            "bJQhMdRO9HT2", "gSmhTZ1ZAAtA", "s1gbYQwxxVvk", "WiL4OU9qVGGV", "Z9Kcpa8kwk26",
            "e0LB704TeLcQ", "Kd5IMoTdcPfl", "5bxWyUj2sYyO", "ujoCoO8zaI7h", "jhRLgwCZhi1b",
            "Hi6wk0ZxAAnX", "uwFwcc31N7mM", "cIxkb65Zv8e4", "CHeWDVRVCrlz", "NtB26toKzhch",
            "IntcEtQYgcZM", "1yHxWGtQDA3f", "aruGtQpIDlJN", "s4j3OS095oZO", "qlfKHyttc1b7",
            "eMZieEvwSHp7", "RQRBhQnNcQEU", "ewuc89RfycN5", "BE1DuA5AtReR", "wccrOFVNbtCH",
            "JQxZFNOkM4cu", "1vE0D4ARrj3X", "t59Np8NFoXix", "avgcxNW1Sfwb", "740RloZJvTpz",
            "AOO9SLd5XGlA", "s60soJyRqdNY", "nwETBEsy0CN2", "zCYYtpOC5rZF", "M05UrMAI7cln",
            "ZlX2ErsVIqTf", "N083LZxnV25q", "UJwXNjaw20NH", "0T0osBNJxPMX", "t2tN2PIGCuyw",
            "lO8A8Jkayegg", "8t4qd3gTb4a1", "mhRc0iYtQgj0", "fxA3u7Y4xwMP", "en2MrD0OH8la",
            "9m1kFyUI2oLF", "nngQDEK5oAFc", "1V9ux0ACKfs1", "U8yEa5DG6SS2", "z0Gjpj7jNvtn",
            "T2HUuSdMGKv1", "EYopsd7RuyKP", "o6VETLxd8ssr", "E40CZhLiI4cX", "sKnprmFo4Mf0",
            "zgdynysfmIOL", "cAPVfzGNbkRA", "Us88JXlP4Rfx", "cw9gobfLnzep", "tCDcZUOpRvlt"
        ];

        /* ========= العدادات ========= */
        const stats = {};
        const fmt = n => Number(n || 0).toLocaleString("en-US");

        async function counterRequest(action, key) {
            try {
                const res = await fetch(COUNTER_API + "/" + action + "/" + NAMESPACE + "/" + key);
                if (!res.ok) return 0;
                const data = await res.json();
                return Number(data.value) || 0;
            } catch (e) {
                return null;
            }
        }

        function updateViewsUI() {
            document.querySelectorAll("[data-views]").forEach(function (el) {
                const v = stats[el.dataset.views];
                el.textContent = "👁 " + (v !== undefined ? fmt(v) : "...") + " views";
            });
            if (stats[KEY_SITE] !== undefined) {
                document.getElementById("visits").textContent = "👥 " + fmt(stats[KEY_SITE]) + " visits";
            }
            if (stats[KEY_TOTAL_PLAYS] !== undefined) {
                document.getElementById("plays").textContent = "▶ " + fmt(stats[KEY_TOTAL_PLAYS]) + " plays";
            }
        }

        async function loadPageStats(ids) {
            await Promise.all(ids.map(async function (id) {
                if (stats[id] !== undefined) return;
                const v = await counterRequest("get", id);
                if (v !== null) stats[id] = v;
            }));
            updateViewsUI();
        }

        // زيارة الموقع: مرة واحدة لكل جلسة (الرفرش مبيزودهاش)
        // + جلب إجمالي مرات التشغيل لعرضه في الهيدر
        async function trackVisit() {
            let first = false;
            try {
                first = !sessionStorage.getItem("visited");
                if (first) sessionStorage.setItem("visited", "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest(first ? "hit" : "get", KEY_SITE),
                counterRequest("get", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[KEY_SITE] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        // مشاهدة الفيديو: مرة واحدة لكل فيديو في الجلسة
        // بتزود عداد الفيديو نفسه + عداد إجمالي التشغيل لكل الفيديوهات
        async function trackPlay(id) {
            const key = "played_" + id;
            try {
                if (sessionStorage.getItem(key)) return;
                sessionStorage.setItem(key, "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest("hit", id),
                counterRequest("hit", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[id] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        /* ========= اكتشاف التشغيل =========
           الـ iframe من دومين تاني فمقدرش أقرأ حالة المشغل،
           فبنعتبر الضغط جوه الفيديو = تشغيل.
           الاكتشاف بيتم بطريقتين:
           1) blur: لما الزائر يضغط على iframe الصفحة بتفقد التركيز
           2) polling خفيف: عشان نلقط الانتقال من فيديو لفيديو تاني
              (في الحالة دي حدث blur مبيحصلش) */
        let lastFocusedId = null;

        function checkIframeFocus() {
            const el = document.activeElement;
            if (el && el.tagName === "IFRAME" && el.dataset.id) {
                if (el.dataset.id !== lastFocusedId) {
                    lastFocusedId = el.dataset.id;
                    trackPlay(el.dataset.id);
                }
            } else {
                lastFocusedId = null;
            }
        }

        window.addEventListener("blur", function () {
            setTimeout(checkIframeFocus, 0);
        });
        setInterval(checkIframeFocus, 400);

        /* ========= العرض ========= */
        const totalPages = Math.ceil(videoIds.length / PER_PAGE);
        const container = document.getElementById("videos");
        const pagination = document.getElementById("pagination");

        function getPageFromUrl() {
            const p = parseInt(new URLSearchParams(location.search).get("page"), 10);
            return p >= 1 && p <= totalPages ? p : 1;
        }

        function renderVideos(page) {
            container.innerHTML = "";
            lastFocusedId = null;
            const start = (page - 1) * PER_PAGE;
            const pageIds = videoIds.slice(start, start + PER_PAGE);

            pageIds.forEach(function (id, i) {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML =
                    '<div class="video-wrapper">' +
                        '<iframe data-id="' + id + '" src="https://tv1.indoav.app/e/' + id + '" ' +
                        'loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' +
                    '</div>' +
                    '<div class="video-info">' +
                        '<div class="video-meta"><span data-views="' + id + '">👁 ' +
                        (stats[id] !== undefined ? fmt(stats[id]) : "...") + ' views</span></div>' +
                    '</div>';
                container.appendChild(card);
            });

            loadPageStats(pageIds);
        }

        function renderPagination(page) {
            pagination.innerHTML = "";

            function makeBtn(label, target, opts) {
                opts = opts || {};
                const b = document.createElement("button");
                b.textContent = label;
                if (opts.active) b.classList.add("active");
                if (opts.disabled) b.disabled = true;
                b.onclick = function () { goToPage(target); };
                pagination.appendChild(b);
            }

            makeBtn("« Prev", page - 1, { disabled: page === 1 });
            for (let p = 1; p <= totalPages; p++) {
                makeBtn(p, p, { active: p === page });
            }
            makeBtn("Next »", page + 1, { disabled: page === totalPages });
        }

        function goToPage(page) {
            try { history.pushState({}, "", "?page=" + page); } catch (e) {}
            showPage(page);
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showPage(page) {
            renderVideos(page);
            renderPagination(page);
        }

        window.addEventListener("popstate", function () { showPage(getPageFromUrl()); });

        /* ========= التشغيل ========= */
        showPage(getPageFromUrl());
        trackVisit();
    </script>

</body>
</html>
