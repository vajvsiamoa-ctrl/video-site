<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .video {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <div class="video">
        <iframe
            src="https://tv1.indoav.app/e/M63O5nDB3ebR"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
